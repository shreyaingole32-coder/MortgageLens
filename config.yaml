# MortgageLens Configuration File

project:
  name: "MortgageLens"
  version: "1.0.0"
  author: "Data Analytics Engineering Team"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  target_years:
    - 2023  # Primary single year for initial development
  sample_state: "NC" # Default target state for initial subset evaluation (North Carolina)

database:
  db_name: "mortgagelens_db"
  db_user: "postgres"
  db_port: 5432
  db_host: "localhost"

analysis:
  random_seed: 42
  confidence_level: 0.95
  zscore_threshold: 2.5
  min_segment_sample_size: 30
